[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orange-box"
version = "2.0.0"
description = "Orange: an encrypted computer inside your computer, with its own desktop"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = ["cryptography>=41"]

[project.scripts]
orange = "orange.cli:main"

[tool.setuptools]
packages = ["orange"]
include-package-data = true

[tool.setuptools.package-data]
orange = ["web/*.html", "web/*.css", "web/*.svg", "web/js/*.js", "web/js/apps/*.js", "web/fonts/*"]
