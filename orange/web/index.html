<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orange</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body data-theme="night" data-accent="orange" data-motion="full" data-wall="juice">
  <div id="wall" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
    <div id="wall-custom"></div>
    <div class="grain"></div>
  </div>
  <main id="desktop" aria-label="Orange desktop">
    <section id="greet"></section>
    <div id="windows"></div>
  </main>
  <nav id="rail" aria-label="Apps"></nav>
  <div id="pip" role="status" aria-live="polite"></div>
  <div id="corners"></div>
  <div id="today" hidden></div>
  <div id="snap-ghost" hidden></div>
  <div id="layer"></div>
  <div id="drop" hidden></div>
  <div id="lock" hidden></div>
  <div id="boot"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
